  <rect x="430" y="152" width="186" height="176" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="523" y="196" font-size="34" text-anchor="middle">🔑</text>
  <text x="523" y="232" fill="#92400E" font-size="13" font-weight="bold" text-anchor="middle">獨立可還原對照表</text>
