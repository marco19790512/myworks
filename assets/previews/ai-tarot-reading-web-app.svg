<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="tarotBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#tarotBg)"/>
  <circle cx="100" cy="60" r="1.5" fill="#FDE047"/><circle cx="540" cy="80" r="2" fill="#FDE047"/><circle cx="480" cy="40" r="1.5" fill="#FFF"/>
  <text x="320" y="38" fill="#FDE047" font-family="serif" font-size="18" font-weight="bold" text-anchor="middle">✦ 神秘星啟塔羅 ARCANUM TAROT ✦</text>
  <text x="320" y="58" fill="#C7D2FE" font-family="sans-serif" font-size="10" text-anchor="middle">單牌指引 · 時間軸三牌陣 (過去 / 現在 / 未來) · AI 深度解牌</text>
  <!-- 3 Cards -->
  <g transform="translate(150, 82) rotate(-8)">
    <rect width="92" height="148" rx="10" fill="#1E1B4B" stroke="#FBBF24" stroke-width="2"/>
    <rect x="8" y="8" width="76" height="132" rx="6" fill="none" stroke="#FBBF24" stroke-opacity="0.5"/>
    <text x="46" y="72" fill="#FBBF24" font-size="28" text-anchor="middle">🌙</text>
    <text x="46" y="124" fill="#FDE68A" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">過去 · The Moon</text>
  </g>
  <g transform="translate(274, 72)">
    <rect width="92" height="148" rx="10" fill="#312E81" stroke="#FDE047" stroke-width="2.5"/>
    <rect x="8" y="8" width="76" height="132" rx="6" fill="none" stroke="#FDE047" stroke-opacity="0.6"/>
    <text x="46" y="72" fill="#FDE047" font-size="30" text-anchor="middle">☀️</text>
    <text x="46" y="124" fill="#FFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">現在 · The Sun</text>
  </g>
  <g transform="translate(402, 70) rotate(8)">
    <rect width="92" height="148" rx="10" fill="#1E1B4B" stroke="#FBBF24" stroke-width="2"/>
    <rect x="8" y="8" width="76" height="132" rx="6" fill="none" stroke="#FBBF24" stroke-opacity="0.5"/>
    <text x="46" y="72" fill="#FBBF24" font-size="28" text-anchor="middle">⭐</text>
    <text x="46" y="124" fill="#FDE68A" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">未來 · The Star</text>
  </g>
  <!-- AI Interpretation Box -->
  <rect x="44" y="252" width="552" height="86" rx="14" fill="#1E1B4B" fill-opacity="0.85" stroke="#6366F1"/>
  <text x="64" y="276" fill="#FDE047" font-family="sans-serif" font-size="12" font-weight="bold">🔮 AI 靈魂導師深度解牌</text>
  <text x="64" y="298" fill="#E0E7FF" font-family="sans-serif" font-size="11">太陽正位帶來強大自信與清晰方向，過往的迷霧即將散去，未來星辰指引充滿希望的新機遇...</text>
  <rect x="64" y="310" width="120" height="18" rx="9" fill="#4F46E5"/><text x="124" y="323" fill="#FFF" font-family="sans-serif" font-size="9" text-anchor="middle">支援 4 種主題切換</text>
</svg>