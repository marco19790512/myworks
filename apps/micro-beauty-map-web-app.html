                                />
                                <button

                                >

                    {/* Cute Floating Trigger Avatar */}
                    <button

                                    <path d="M16 32C16 20 22 14 32 14C42 14 48 20 48 32C48 36 47 44 45 48C43 42 41 38 41 38H23C23 38 21 42 19 48C17 44 16 36 16 32Z" fill="#686868"/>
                                    <circle cx="32" cy="33" r="13" fill="#FFE5D9"/>
                                    <circle cx="27" cy="32" r="1.8" fill="#567138"/>
                                    <circle cx="37" cy="32" r="1.8" fill="#567138"/>
                                    <circle cx="24" cy="35" r="2.5" fill="#EAD3CD" opacity="0.8"/>
                                    <circle cx="40" cy="35" r="2.5" fill="#EAD3CD" opacity="0.8"/>
                                    <path d="M30 36Q32 38 34 36" stroke="#D4B89E" strokeWidth="1.5" strokeLinecap="round"/>
                                    <circle cx="40" cy="22" r="3.5" fill="#A8C382"/>
                                    <circle cx="40" cy="22" r="1.5" fill="#FFFFFF"/>
                                </svg>
                            </div>
                        </div>
                    </button>
                </div>

        };

        // --- Main App Container ---
        function App() {
            // Navigation State
            const [currentRoute, setCurrentRoute] = useState('home'); // home, explore, review-detail, write-review, coupons, coupon-detail, providers, provider-detail, member, points, favorites, admin
            const [selectedId, setSelectedId] = useState(null);
            const [selectedCategory, setSelectedCategory] = useState(null);
            const [searchKeyword, setSearchKeyword] = useState('');

            // Audio Player State
            const [isPlayingMusic, setIsPlayingMusic] = useState(true);
            const audioRef = useRef(null);

            // Auto-start music on initial load
            useEffect(() => {
                if (audioRef.current) {
                    audioRef.current.play().then(() => {
                        setIsPlayingMusic(true);
                    }).catch(err => {
                        console.log("Autoplay blocked by browser policy until interaction:", err);
                        setIsPlayingMusic(false);
                    });
                }
            }, []);

            const toggleMusic = () => {
                if (!audioRef.current) return;
                if (isPlayingMusic) {
                    audioRef.current.pause();
                    setIsPlayingMusic(false);
                    setToast('背景音樂已暫停');
                } else {
                    audioRef.current.play().then(() => {
                        setIsPlayingMusic(true);
                        setToast('背景音樂播放中 🎵');
                    }).catch(err => {
                        console.log("Audio play error:", err);
                        setToast('無法播放背景音樂，請稍後重試');
                    });
                }
            };

            // Global Demo User State
            const [user, setUser] = useState({
                name: '小柔愛美',
                avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
                points: 680,
                badge: '體驗分享新星',
                joinedDate: '2026-01-15',
                reviewCount: 3
            });

            // Demo User Wallet & Favorites
            const [userCoupons, setUserCoupons] = useState([
                {
                    code: 'MBDEMO-8892',
                    title: '美容療程折抵券',
                    providerName: '花漾美學診所',
                    validUntil: '2026-12-31',
                    status: 'unused'
                },
                {
                    code: 'MBDEMO-3341',
                    title: '品牌保養品試用組',
                    providerName: 'SKINORA 綠色植萃保養',
                    validUntil: '2026-11-30',
                    status: 'unused'
                }
            ]);

            const [likedReviews, setLikedReviews] = useState(['rev-1', 'rev-2']);
            const [reviews, setReviews] = useState(MOCK_REVIEWS);

            // Toast Message State
            const [toast, setToast] = useState('');

            const [pointLogs, setPointLogs] = useState([
                { id: 'l1', event: '首次登入體驗獎勵', points: '+100', date: '2026-10-01', status: '已發放' },

                { id: 'l3', event: '完成文章問答互動', points: '+10', date: '2026-10-15', status: '已發放' }
            ]);

            // Helper Router Nav
            const navigateTo = (route, id = null, category = null) => {
                setCurrentRoute(route);
                if (id) setSelectedId(id);
                if (category) setSelectedCategory(category);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // Actions
            const handleToggleLike = (reviewId) => {
                if (likedReviews.includes(reviewId)) {
                    setLikedReviews(likedReviews.filter(id => id !== reviewId));
                    setReviews(reviews.map(r => r.id === reviewId ? { ...r, likes: r.likes - 1 } : r));
                    setToast('已取消按讚');
                } else {
                    setLikedReviews([...likedReviews, reviewId]);
                    setReviews(reviews.map(r => r.id === reviewId ? { ...r, likes: r.likes + 1 } : r));
                    setToast('按讚成功！');
                }
            };

            const handleToggleFavorite = (reviewId) => {
                if (userFavorites.includes(reviewId)) {
                    setUserFavorites(userFavorites.filter(id => id !== reviewId));
                    setToast('已從收藏清單移除');
                } else {
                    setUserFavorites([...userFavorites, reviewId]);
                    setToast('已加入我的收藏清單！');
                }
            };

            const handleAddComment = (reviewId, commentText) => {
                if (!commentText.trim()) return;
                const newComment = {
                    id: 'c-' + Date.now(),
                    user: user.name,
                    text: commentText,
                    date: '剛剛'
                };
                setReviews(reviews.map(r => r.id === reviewId ? {
                    ...r,
                    commentsCount: r.commentsCount + 1,
                    comments: [...r.comments, newComment]
                } : r));

                // Add points reward for commenting
                setUser(u => ({ ...u, points: u.points + 10 }));
                setPointLogs(prev => [{
                    id: 'l-' + Date.now(),
                    event: '發表社群留言獎勵',
                    points: '+10',
                    date: new Date().toISOString().split('T')[0],
                    status: '已發放'
                }, ...prev]);

                setToast('留言成功！獲得 +10 積分獎勵 🎉');
            };

            const handleRedeemCoupon = (coupon) => {
                if (user.points < coupon.pointsRequired) {
                    setToast('積分不足無法兌換此券！');
                    return;
                }
                // Deduct points
                setUser(u => ({ ...u, points: u.points - coupon.pointsRequired }));
                // Add to wallet
                const newCoupon = {
                    code: 'MBDEMO-' + Math.floor(1000 + Math.random() * 9000),
                    title: coupon.title,
                    providerName: coupon.providerName,
                    validUntil: coupon.validUntil,
                    status: 'unused'
                };
                setUserCoupons([newCoupon, ...userCoupons]);
                // Log point deduction
                setPointLogs(prev => [{
                    id: 'l-' + Date.now(),
                    event: `兌換優惠券《${coupon.title}》`,
                    points: `-${coupon.pointsRequired}`,
                    date: new Date().toISOString().split('T')[0],
                    status: '已完成'
                }, ...prev]);

                setToast('優惠券兌換成功！已存入會員錢包 🎁');
                navigateTo('member');
            };

                const newRev = {
                    id: 'rev-' + Date.now(),
                    title: formData.title,
                    content: formData.content,
                    author: user.name,
                    avatar: user.avatar,
                    category: formData.category,
                    location: formData.location || '台北市',
                    providerName: formData.providerName || '微美精選合作店家',
                    rating: Number(formData.rating),
                    likes: 1,
                    commentsCount: 0,
                    isSponsored: formData.isSponsored,
                    coverImage: formData.image || 'https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?w=800&auto=format&fit=crop&q=80',
                    images: [formData.image || 'https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?w=800&auto=format&fit=crop&q=80'],
                    date: new Date().toISOString().split('T')[0],
                    status: 'published',
                    comments: []
                };

                setReviews([newRev, ...reviews]);
                setUser(u => ({ ...u, points: u.points + 50, reviewCount: u.reviewCount + 1 }));
                setPointLogs(prev => [{
                    id: 'l-' + Date.now(),
                    event: `發表心得文章《${formData.title.substring(0, 10)}...》`,
                    points: '+50',
                    date: new Date().toISOString().split('T')[0],
                    status: '已發放'
                }, ...prev]);

                setToast('發布成功！感謝分享，獲得 +50 積分！✨');
                navigateTo('review-detail', newRev.id);
            };

            const handleUseCoupon = (code) => {
                setUserCoupons(userCoupons.map(cp => cp.code === code ? { ...cp, status: 'used' } : cp));
                setToast(`優惠券 (${code}) 出示核銷成功！`);
            };

                    <NotificationToast message={toast} onClose={() => setToast('')} />

                    <AiAssistant onNavigate={navigateTo} />

                        preload="auto"

                                <div className="w-9 h-9 rounded-full bg-[#A8C382]/30 flex items-center justify-center border border-[#A8C382]">

                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>

                                onClick={() => alert(`DEMO模式：已發送預約諮詢通知至 ${provider.name} 客服服務中心`)}
                                className="bg-[#567138] text-white px-5 py-2 rounded-xl hover:bg-[#43592a]"
                            >
                                條列預約
                            </button>
                        </div>
                    </div>

                    {/* Store Reviews */}
                    <div className="space-y-4">
                        <h3 className="font-serif-title text-lg font-bold text-[#567138]">此店家的社群體驗評價 ({relatedReviews.length})</h3>
                        {relatedReviews.length > 0 ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {relatedReviews.map(r => (
                                    <div key={r.id} onClick={() => onNavigate('review-detail', r.id)} className="bg-white p-4 rounded-2xl border border-gray-100 hover:border-[#A8C382] cursor-pointer space-y-2">
                                        <div className="font-bold text-xs text-[#686868]">{r.title}</div>
                                        <p className="text-[11px] text-gray-500 line-clamp-2">{r.content}</p>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="bg-white p-6 rounded-2xl text-xs text-gray-400 text-center">目前尚無專屬心得發布</div>
                        )}
                    </div>
                </div>
            );
        }

        // 9. MEMBER CENTER PAGE
        function MemberCenterPage({ user, userCoupons, userFavorites, reviews, onNavigate, onUseCoupon }) {
            const [activeTab, setActiveTab] = useState('coupons'); // coupons, favorites, my-reviews

            const favoriteReviews = reviews.filter(r => userFavorites.includes(r.id));
            const myReviews = reviews.filter(r => r.author === user.name);

            return (
                <div className="max-w-4xl mx-auto px-4 py-8 space-y-6">
                    {/* User Profile Card */}
                    <div className="bg-white p-6 rounded-3xl border border-[#EAD3CD] shadow-sm flex flex-col sm:flex-row items-center gap-6">
                        <img src={user.avatar} alt={user.name} className="w-20 h-20 rounded-full object-cover border-2 border-[#A8C382]" />
                        <div className="space-y-2 text-center sm:text-left flex-1">
                            <div className="flex flex-wrap items-center justify-center sm:justify-start gap-2">
                                <h1 className="font-serif-title text-xl font-bold text-[#567138]">{user.name}</h1>
                                <span className="bg-[#D4B89E]/30 text-[#686868] text-[10px] px-2.5 py-0.5 rounded-full font-bold">
                                    ✦ {user.badge}
                                </span>
                            </div>
                            <p className="text-xs text-gray-400">加入日期：{user.joinedDate} ｜ 已分享心得：{user.reviewCount} 篇</p>
                        </div>
                        <div className="bg-[#F7F5EE] px-6 py-4 rounded-2xl text-center border border-[#EAD3CD]/60 space-y-1">
                            <div className="text-xs text-gray-500">目前累積積分</div>
                            <div className="text-2xl font-bold text-[#567138]">{user.points} <span className="text-xs font-normal">Pt</span></div>
                            <button onClick={() => onNavigate('points')} className="text-[11px] text-[#567138] underline font-medium">查看積分紀錄</button>
                        </div>
                    </div>

                    {/* Member Tabs */}
                    <div className="flex border-b border-gray-200 text-xs font-medium space-x-6">
                        <button 
                            onClick={() => setActiveTab('coupons')}
                            className={`pb-3 ${activeTab === 'coupons' ? 'text-[#567138] font-bold border-b-2 border-[#567138]' : 'text-gray-400 hover:text-gray-600'}`}
                        >
                            我的優惠券錢包 ({userCoupons.length})
                        </button>
                        <button 
                            onClick={() => setActiveTab('favorites')}
                            className={`pb-3 ${activeTab === 'favorites' ? 'text-[#567138] font-bold border-b-2 border-[#567138]' : 'text-gray-400 hover:text-gray-600'}`}
                        >
                            我的收藏心得 ({userFavorites.length})
                        </button>
                        <button 
                            onClick={() => setActiveTab('my-reviews')}
                            className={`pb-3 ${activeTab === 'my-reviews' ? 'text-[#567138] font-bold border-b-2 border-[#567138]' : 'text-gray-400 hover:text-gray-600'}`}
                        >
                            我的發表紀錄 ({myReviews.length})
                        </button>
                    </div>

                    {/* Tab Content */}
                    <div>
                        {activeTab === 'coupons' && (
                            <div className="space-y-4">
                                {userCoupons.length > 0 ? (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        {userCoupons.map(cp => (
                                            <div key={cp.code} className="bg-white p-4 rounded-2xl border border-[#EAD3CD] space-y-3 shadow-sm">
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <div className="text-xs font-bold text-[#567138]">{cp.title}</div>
                                                        <div className="text-[10px] text-gray-400">{cp.providerName}</div>
                                                    </div>
                                                    <span className={`text-[10px] px-2 py-0.5 rounded font-medium ${cp.status === 'unused' ? 'bg-[#A8C382]/20 text-[#567138]' : 'bg-gray-100 text-gray-400'}`}>
                                                        {cp.status === 'unused' ? '未使用' : '已核銷使用'}
                                                    </span>
                                                </div>
                                                <div className="bg-[#F7F5EE] p-2.5 rounded-xl text-center space-y-1">
                                                    <div className="text-[10px] text-gray-400">專屬核銷代碼 (DEMO)</div>
                                                    <div className="font-mono text-sm font-bold text-[#686868] tracking-wider">{cp.code}</div>
                                                </div>
                                                <div className="flex justify-between items-center text-[10px] text-gray-400 pt-1">
                                                    <span>有效期限至：{cp.validUntil}</span>
                                                    {cp.status === 'unused' && (
                                                        <button 
                                                            onClick={() => onUseCoupon(cp.code)}
                                                            className="bg-[#D4B89E] hover:bg-[#c2a488] text-white px-3 py-1 rounded-lg font-medium transition-colors"
                                                        >
                                                            出示核銷
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="bg-white p-8 rounded-2xl text-center text-xs text-gray-400">目前尚無已兌換的優惠券</div>
                                )}
                            </div>
                        )}

                        {activeTab === 'favorites' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {favoriteReviews.map(r => (
                                    <div key={r.id} onClick={() => onNavigate('review-detail', r.id)} className="bg-white p-4 rounded-2xl border border-gray-100 hover:border-[#A8C382] cursor-pointer space-y-2">
                                        <div className="font-bold text-xs text-[#686868]">{r.title}</div>
                                        <p className="text-[11px] text-gray-500 line-clamp-2">{r.content}</p>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'my-reviews' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {myReviews.map(r => (
                                    <div key={r.id} onClick={() => onNavigate('review-detail', r.id)} className="bg-white p-4 rounded-2xl border border-gray-100 hover:border-[#A8C382] cursor-pointer space-y-2">
                                        <div className="font-bold text-xs text-[#686868]">{r.title}</div>
                                        <div className="text-[10px] text-[#567138]">已獲得點數：+50 Pt</div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // 10. POINTS LOG PAGE
        function PointsPage({ user, pointLogs, coupons, onRedeem, onNavigate }) {
            return (
                <div className="max-w-4xl mx-auto px-4 py-8 space-y-6">
                    <div className="bg-[#567138] text-white p-6 rounded-3xl space-y-4 shadow-md">
                        <div className="flex justify-between items-center">
                            <div>
                                <div className="text-xs text-white/80">微美地圖分享點數</div>
                                <div className="text-3xl font-bold font-serif-title mt-1">{user.points} <span className="text-sm font-sans font-normal">Pt</span></div>
                            </div>
                            <button onClick={() => onNavigate('coupons')} className="bg-white text-[#567138] text-xs px-4 py-2 rounded-full font-medium hover:bg-gray-100">
                                兌換專屬優惠券
                            </button>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-3xl border border-[#EAD3CD] shadow-sm space-y-4">
                        <h3 className="font-bold text-sm text-[#567138]">積分任務與獎勵規則 (DEMO)</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                            <div className="bg-[#F7F5EE] p-3 rounded-xl flex justify-between">
                                <span>首次完成登入體驗</span>
                                <span className="font-bold text-[#567138]">+100 Pt</span>
                            </div>
                            <div className="bg-[#F7F5EE] p-3 rounded-xl flex justify-between">
                                <span>完成心得文章發布</span>
                                <span className="font-bold text-[#567138]">+50 Pt</span>
                            </div>
                            <div className="bg-[#F7F5EE] p-3 rounded-xl flex justify-between">
                                <span>文章互動與優質留言</span>
                                <span className="font-bold text-[#567138]">+10 Pt</span>
                            </div>
                            <div className="bg-[#F7F5EE] p-3 rounded-xl flex justify-between">
                                <span>成功分享心得連結</span>
                                <span className="font-bold text-[#567138]">+50 Pt</span>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-3xl border border-[#EAD3CD] shadow-sm space-y-4">
                        <h3 className="font-bold text-sm text-[#567138]">積分異動歷史紀錄</h3>
                        <div className="divide-y divide-gray-100 text-xs">
                            {pointLogs.map(log => (
                                <div key={log.id} className="py-3 flex justify-between items-center">
                                    <div>
                                        <div className="font-medium text-[#686868]">{log.event}</div>
                                        <div className="text-[10px] text-gray-400">{log.date}</div>
                                    </div>
                                    <div className={`font-bold ${log.points.startsWith('+') ? 'text-[#567138]' : 'text-amber-600'}`}>
                                        {log.points}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // 11. ADMIN DASHBOARD PAGE
        function AdminPage({ reviews, userCount, totalPointsIssued, userCoupons, onNavigate }) {
            return (
                <div className="max-w-6xl mx-auto px-4 py-8 space-y-6">
                    <div className="flex justify-between items-center border-b border-gray-200 pb-4">
                        <div>
                            <h1 className="font-serif-title text-2xl font-bold text-[#567138]">平台營運管理後台</h1>
                            <p className="text-xs text-gray-400">展示模式管理審核介面（全端與資料庫獨立整合預留）</p>
                        </div>
                        <span className="bg-[#D4B89E] text-white text-xs px-3 py-1 rounded-full font-semibold">
                            DEMO Admin Mode
                        </span>
                    </div>

                    {/* Stats Metrics */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="bg-white p-4 rounded-2xl border border-[#EAD3CD] space-y-1">
                            <div className="text-xs text-gray-400">社群註冊會員數</div>
                            <div className="text-xl font-bold text-[#567138]">{userCount}</div>
                        </div>
                        <div className="bg-white p-4 rounded-2xl border border-[#EAD3CD] space-y-1">
                            <div className="text-xs text-gray-400">全站發布體驗文章</div>
                            <div className="text-xl font-bold text-[#567138]">{reviews.length}</div>
                        </div>
                        <div className="bg-white p-4 rounded-2xl border border-[#EAD3CD] space-y-1">
                            <div className="text-xs text-gray-400">累計發放積分點數</div>
                            <div className="text-xl font-bold text-[#D4B89E]">{totalPointsIssued} Pt</div>
                        </div>
                        <div className="bg-white p-4 rounded-2xl border border-[#EAD3CD] space-y-1">
                            <div className="text-xs text-gray-400">優惠券兌換總人次</div>
                            <div className="text-xl font-bold text-[#567138]">{userCoupons.length + 18}</div>
                        </div>
                    </div>

                    {/* Review Approval Queue */}
                    <div className="bg-white p-6 rounded-3xl border border-[#EAD3CD] shadow-sm space-y-4">
                        <h3 className="font-bold text-sm text-[#567138]">心得審核與內容管理</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs text-gray-600">
                                <thead className="bg-[#F7F5EE] text-[#567138] font-bold">
                                    <tr>
                                        <th className="p-3">文章標題</th>
                                        <th className="p-3">作者</th>
                                        <th className="p-3">類別</th>
                                        <th className="p-3">日期</th>
                                        <th className="p-3">狀態</th>
                                        <th className="p-3">操作</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {reviews.map(r => (
                                        <tr key={r.id}>
                                            <td className="p-3 font-medium text-[#686868] max-w-xs truncate">{r.title}</td>
                                            <td className="p-3">{r.author}</td>
                                            <td className="p-3">{r.category}</td>
                                            <td className="p-3">{r.date}</td>
                                            <td className="p-3"><span className="bg-[#A8C382]/20 text-[#567138] px-2 py-0.5 rounded text-[10px]">已審核公開</span></td>
                                            <td className="p-3">
                                                <button onClick={() => onNavigate('review-detail', r.id)} className="text-[#567138] hover:underline mr-2">檢視</button>
                                                <button onClick={() => alert('展示模式：已被標記退回修改')} className="text-gray-400 hover:text-red-500">下架</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // SECTION: REUSABLE UI CARDS
        // ==========================================

        function ReviewCard({ review, onNavigate, onLike, onFavorite, isFav, isLiked }) {
            return (
                <div className="bg-white rounded-2xl border border-[#EAD3CD]/70 overflow-hidden shadow-sm hover:shadow-md hover:border-[#A8C382] transition-all flex flex-col">
                    <div className="relative h-48 overflow-hidden cursor-pointer" onClick={() => onNavigate('review-detail', review.id)}>
                        <img src={review.coverImage} alt={review.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                        <span className="absolute top-3 left-3 bg-[#F7F5EE]/90 backdrop-blur text-[#567138] text-[10px] font-bold px-2.5 py-1 rounded-full border border-[#A8C382]">
                            {review.category}
                        </span>
                        <button 
                            onClick={(e) => { e.stopPropagation(); onFavorite(review.id); }}
                            className="absolute top-3 right-3 w-7 h-7 rounded-full bg-white/80 flex items-center justify-center text-xs shadow hover:bg-white"
                        >
                            {isFav ? '★' : '☆'}
                        </button>
                    </div>

                    <div className="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div className="space-y-1.5 cursor-pointer" onClick={() => onNavigate('review-detail', review.id)}>
                            <div className="flex items-center gap-1 text-amber-400 text-xs">
                                {'★'.repeat(review.rating)}{'☆'.repeat(5 - review.rating)}
                            </div>
                            <h3 className="font-serif-title text-sm font-bold text-[#686868] line-clamp-2 hover:text-[#567138] transition-colors">
                                {review.title}
                            </h3>
                            <p className="text-xs text-gray-400 line-clamp-2">{review.content}</p>
                        </div>

                        <div className="pt-2 border-t border-gray-100 flex items-center justify-between text-xs">
                            <div className="flex items-center gap-2">
                                <img src={review.avatar} alt={review.author} className="w-5 h-5 rounded-full object-cover"/>
                                <span className="text-gray-500 text-[11px] font-medium">{review.author}</span>
                            </div>
                            <div className="flex items-center gap-3 text-gray-400 text-[11px]">
                                <button onClick={() => onLike(review.id)} className="hover:text-red-500 flex items-center gap-0.5">
                                    <span>{isLiked ? '❤️' : '🤍'}</span>
                                    <span>{review.likes}</span>
                                </button>
                                <span>💬 {review.commentsCount}</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function CouponCard({ coupon, onNavigate, onRedeem, userPoints, showRedeemBtn }) {
            return (
                <div className="bg-white rounded-2xl border border-[#EAD3CD] overflow-hidden shadow-sm flex flex-col justify-between">
                    <div className="relative h-40 overflow-hidden cursor-pointer" onClick={() => onNavigate('coupon-detail', coupon.id)}>
                        <img 
                            src={coupon.image} 
                            alt={coupon.title} 
                            className="w-full h-full object-cover" 
                            onError={(e) => {
                                e.target.onerror = null;
                                e.target.src = 'https://placehold.co/600x400/A8C382/FFFFFF?text=Micro+Beauty+Coupon';
                            }}
                        />
                        <div className="absolute top-3 right-3 bg-[#D4B89E] text-white px-2.5 py-1 rounded-full text-[10px] font-bold">
                            {coupon.discountText}
                        </div>
                    </div>
                    <div className="p-4 space-y-3">
                        <div>
                            <div className="text-[10px] text-gray-400">{coupon.providerName}</div>
                            <h3 className="font-bold text-xs text-[#567138]">{coupon.title}</h3>
                        </div>
                        <div className="flex justify-between items-center text-xs">
                            <span className="text-gray-400">所需積分</span>
                            <span className="font-bold text-[#D4B89E] text-sm">{coupon.pointsRequired} Pt</span>
                        </div>
                        {showRedeemBtn ? (
                            <button 
                                onClick={() => onRedeem(coupon)}
                                className="w-full bg-[#567138] hover:bg-[#43592a] text-[#ffffff] py-2 rounded-xl text-xs font-medium transition-colors"
                            >
                                兌換體驗券
                            </button>
                        ) : (
                            <button onClick={() => onNavigate('coupon-detail', coupon.id)} className="w-full border border-[#D4B89E] text-[#686868] py-2 rounded-xl text-xs font-medium hover:bg-[#F7F5EE]">
                                查看詳情
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        function ProviderCard({ provider, onNavigate }) {
            return (
                <div className="bg-white rounded-2xl border border-[#EAD3CD] p-4 flex gap-4 items-center hover:border-[#A8C382] shadow-sm transition-all cursor-pointer" onClick={() => onNavigate('provider-detail', provider.id)}>
                    <img src={provider.image} alt={provider.name} className="w-24 h-24 rounded-xl object-cover flex-shrink-0" />
                    <div className="space-y-1.5 flex-1 min-w-0">
                        <span className="bg-[#A8C382]/20 text-[#567138] text-[10px] font-semibold px-2 py-0.5 rounded">
                            {provider.category}
                        </span>
                        <h3 className="font-serif-title font-bold text-sm text-[#567138] truncate">{provider.name}</h3>
                        <p className="text-[11px] text-gray-400 truncate">📍 {provider.location}</p>
                        <div className="text-[11px] text-[#686868] line-clamp-1">{provider.intro}</div>
                    </div>
                </div>
            );
        }

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
